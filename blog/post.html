<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artículo · Blog · Alexander Armentia</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Caveat:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap"
        rel="stylesheet" />

    <!-- Style sheets -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/blog/blog.css" />
    <meta name="theme-color" content="#0d0d14" />
    <link rel="icon" type="image/png" href="/favicon.png" />
</head>

<body>
    <!-- OVERLAYS -->
    <div class="noise-overlay"></div>
    <div class="grid-overlay"></div>
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- CURSOR -->
    <div class="cursor-ring" id="cursorRing"></div>
    <div class="cursor-dot" id="cursorDot"></div>
    <canvas class="cursor-trail" id="trailCanvas"></canvas>

    <!-- BG CANVAS -->
    <canvas id="bgCanvas"></canvas>

    <!-- NAV -->
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-logo" id="nav-logo">
                <span class="logo-bracket">[</span>
                <span class="logo-text" data-scramble="ALEX">ALEX</span>
                <span class="logo-bracket">]</span>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="/#yo" class="nav-link"><span class="nl-num">01.</span> Yo</a></li>
                <li><a href="/#skills" class="nav-link"><span class="nl-num">02.</span> Skills</a></li>
                <li><a href="/#vida" class="nav-link"><span class="nl-num">03.</span> Historia</a></li>
                <li><a href="/#gustos" class="nav-link"><span class="nl-num">04.</span> Intereses</a></li>
                <li><a href="/blog/" class="nav-link"><span class="nl-num">05.</span> Blog</a></li>
                <li><a href="/#contacto" class="nav-link"><span class="nl-num">06.</span> Contacto</a></li>
            </ul>
            <button class="hamburger" id="hamburger" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- ========== POST SECTION ========== -->
    <section class="section post-section" id="post-section">
        <div class="section-inner">
            <a class="home mono reveal-up" href="/blog/" style="color: var(--a); font-size: 0.8rem; display: inline-block; margin-bottom: 2rem;">&larr; [ volver_al_blog.sh ]</a>

            <div class="glass-card post-card reveal-up">
                <!-- Terminal Header -->
                <div class="terminal-bar" style="margin-bottom: 2rem;">
                    <span class="term-dot td-red"></span>
                    <span class="term-dot td-yellow"></span>
                    <span class="term-dot td-green"></span>
                    <code class="term-text">
                        <span class="term-prefix">~</span>/blog/posts/<span class="term-cmd" id="terminal-post-slug">loading.md</span>
                    </code>
                </div>

                <!-- Injected Article Content -->
                <article id="post" class="post">
                    <div class="mono" style="color: var(--a);">Descifrando archivo...</div>
                </article>

                <!-- Sharing Panel -->
                <div class="share-panel">
                    <span class="mono share-hdr">// compartir_articulo.sh</span>
                    <div class="share-btns">
                        <a id="share-linkedin" class="btn btn-ghost mag-btn" target="_blank" rel="noopener">
                            <span>LinkedIn</span>
                        </a>
                        <a id="share-twitter" class="btn btn-ghost mag-btn" target="_blank" rel="noopener">
                            <span>Compartir en X</span>
                        </a>
                        <button id="share-copy" class="btn btn-ghost mag-btn">
                            <span id="copy-btn-text">Copiar Enlace</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer" role="contentinfo">
        <div class="footer-inner">
            <span class="mono" style="font-size: 0.8rem; color: var(--td);">// alexander.armentia &middot; alexar69 &middot; madrid &middot; 2026 &middot; blog &nbsp;⚡</span>
            <a href="/blog/" class="back-top mono" style="font-size: 0.8rem; color: var(--a);">&larr; [blog]</a>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="/blog/post.js" defer></script>
    <script src="/alx_v7.js" defer></script>
</body>

</html>

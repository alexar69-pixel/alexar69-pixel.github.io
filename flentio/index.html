<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Flentio Enterprise Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Centro de Documentación de Flentio Enterprise">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Theme: Modern Corporate/Dark Theme via Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --base-color: #f1f5f9;
      --theme-color: #0ea5e9; /* Cyan accent */
      --sidebar-background: #0f172a;
      --background-color: #020617;
      --heading-color: #38bdf8;
      --sidebar-name-color: #e2e8f0;
      --link-color: #0ea5e9;
      --link-color--hover: #38bdf8;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--active: #38bdf8;
    }
    body {
        font-family: 'Inter', system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="app">Cargando documentación...</div>
  <script>
    window.$docsify = {
      name: 'Flentio Docs',
      repo: '',
      loadSidebar: 'sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      search: 'auto', // default
      search: {
        maxAge: 86400000, 
        paths: 'auto',
        placeholder: 'Buscar...',
        noData: 'No se encontraron resultados!',
        depth: 3
      },
      copyCode: {
        buttonText : 'Copiar',
        errorText  : 'Error',
        successText: 'Copiado'
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Siguiente',
        crossChapter: true,
        crossChapterText: true,
      },
    }
  </script>
  
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
